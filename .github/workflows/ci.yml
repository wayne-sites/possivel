name: Validar projeto
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar JavaScript principal
        run: node --check script.js
      - name: Validar JavaScript dos microprodutos
        run: node --check microprodutos/app.js
      - name: Validar configuração Vercel dos microprodutos
        run: node -e "JSON.parse(require('fs').readFileSync('microprodutos/vercel.json','utf8')); console.log('vercel.json ok')"
      - run: node tests/static-check.mjs
  mobile-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar manifests mobile quando presentes
        run: |
          if [ -f mobile/package.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('mobile/package.json')); JSON.parse(require('fs').readFileSync('mobile/app.json')); console.log('manifests ok')"
          else
            echo "Pasta mobile não encontrada; etapa ignorada."
          fi